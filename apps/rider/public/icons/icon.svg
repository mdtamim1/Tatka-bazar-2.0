<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6B2B"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>
  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  
  <!-- Bike Delivery Rider Emblem -->
  <g fill="#ffffff" filter="url(#glow)" transform="translate(100, 100) scale(0.61)">
    <circle cx="100" cy="380" r="70" fill="none" stroke="#ffffff" stroke-width="32"/>
    <circle cx="412" cy="380" r="70" fill="none" stroke="#ffffff" stroke-width="32"/>
    
    <!-- Rider body & frame -->
    <path d="M100 380 L230 380 L320 220 L210 220 Z" fill="none" stroke="#ffffff" stroke-width="28" stroke-linejoin="round"/>
    <path d="M230 380 L300 130 L360 130" fill="none" stroke="#ffffff" stroke-width="28" stroke-linecap="round"/>
    <path d="M320 220 L412 380" fill="none" stroke="#ffffff" stroke-width="28" stroke-linecap="round"/>
    
    <!-- Rider head/helmet -->
    <circle cx="270" cy="90" r="38" fill="#ffffff"/>
    
    <!-- Delivery Box -->
    <rect x="70" y="150" width="110" height="110" rx="16" fill="#00D68F" stroke="#ffffff" stroke-width="16"/>
  </g>

  <!-- Brand Label -->
  <text x="256" y="450" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="900" text-anchor="middle" letter-spacing="2">
    TATKA RIDER
  </text>
</svg>
